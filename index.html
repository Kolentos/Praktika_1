<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Praktika3</title>
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <script src="3-praktika.js"></script>
        <link href="3-praktika.css" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <header class="header">
            <p class="header__text">РЕМОНТ ТЕХНИКИ РАЗЛИЧНЫХ БРЕНДОВ</p>
        </header>
        <main>
            <div class="brend__line swiper">
                <div class="swiper-wrapper">
                <div class="brend__line__block swiper-slide"><img class="brend__line__block__img" src="./Icons/Lenovo.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block swiper-slide"><img class="brend__line__block__img" src="./Icons/samsung.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block swiper-slide"><img class="brend__line__block__img" src="./Icons/apple.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block swiper-slide"><img class="brend__line__block__img" src="./Icons/bosch.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block swiper-slide"><img class="brend__line__block__img" src="./Icons/hp.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block swiper-slide"><img class="brend__line__block__img" src="./Icons/acer.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                
                <div class="brend__line__block brend__line__block__1121px swiper-slide"><img class="brend__line__block__img" src="./Icons/hp.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block brend__line__block__1121px swiper-slide"><img class="brend__line__block__img" src="./Icons/acer.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>



                <div class="brend__line__block swiper-slide hidden"><img class="brend__line__block__img" src="./Icons/Lenovo.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block swiper-slide hidden"><img class="brend__line__block__img" src="./Icons/Lenovo.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                <div class="brend__line__block brend__line__block__1121px swiper-slide hidden"><img class="brend__line__block__img" src="./Icons/Lenovo.png"><img class="brend__line__block__icon" src="./Icons/Brend__block__svg.svg"></div>
                </div>
                <div class="swiper-pagination"></div>
                <div class="show_all"><img class="show_all__img" src="./Icons/strelochka.svg"><p>Показать все</p></div>
            </div>
        </main>
    </body>
</html>
